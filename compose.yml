name: xufu
services:
  app:
    build: .
    image: xufu-app:${XUPAY_IMAGE_TAG:-local}
    container_name: xufu-app
    init: true
    restart: unless-stopped
    ports:
      - "${XUPAY_BIND:-0.0.0.0}:${XUPAY_PORT:-5496}:18860"
    shm_size: 1gb
    stop_grace_period: 30s
    environment:
      DATABASE_URL: postgres://xupay:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/xupay?sslmode=disable
      MASTER_KEY: ${MASTER_KEY:?set MASTER_KEY}
      BOOTSTRAP_EMAIL: ${BOOTSTRAP_EMAIL:?set BOOTSTRAP_EMAIL}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:?set BOOTSTRAP_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:18860/health/ready"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
  postgres:
    image: postgres:18-bookworm
    container_name: xufu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: xupay
      POSTGRES_USER: xupay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xupay -d xupay"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  postgres-data:
